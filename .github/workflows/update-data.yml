# Runs scripts/fetch_fec.py and scripts/fetch_early_vote.py on a timer and commits any new data back to the repo.
# GitHub Pages then republishes the site automatically.
name: Update data

on:
  schedule:
    - cron: "23 * * * *"       # hourly (UTC). Each run picks up where the last left off.
  workflow_dispatch:            # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:                      # also run when the race list or the script changes
      - "data/races.json"
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write               # lets the job commit data back to the repo

concurrency:
  group: update-data            # never run two of these at once
  cancel-in-progress: true      # a newer run replaces an older one still going

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15         # safety net: never let a stuck run hang for hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch FEC money
        run: python scripts/fetch_fec.py
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        continue-on-error: true   # one source failing shouldn't block the others

      - name: Fetch early-vote numbers (UF Election Lab)
        run: python scripts/fetch_early_vote.py
        continue-on-error: true   # if UF is down, still save the money data

      - name: Fetch polls and build averages (VoteHub)
        run: python scripts/fetch_polls.py
        continue-on-error: true

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
