# Temporary: test the Alaska PDF parser (round 2). Delete after use.
name: Probe Alaska
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install pypdf && mkdir -p probe
      - run: |
          sudo apt-get install -y poppler-utils >/dev/null 2>&1 || true
          curl -sk -o probe/ak.pdf https://www.elections.alaska.gov/enr26/results/ElectionSummaryReportRPT.pdf
          pdftotext -layout probe/ak.pdf probe/alaska_layout.txt
          rm probe/ak.pdf
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/ && git commit -m "Probe Alaska" && git pull --rebase && git push
