# Temporary: election-day check that civicAPI isn't flagging test data. Delete after use.
name: Probe civicAPI status
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p probe
          for id in 87528 87524 87243; do
            curl -s -m 60 -A "abholder-elections/1.0" "https://civicapi.org/api/v2/race/$id" | python3 -c "import json,sys;d=json.load(sys.stdin);print($id, d.get('election_name'), 'test_data=',d.get('test_data'), 'date=',d.get('election_date'), 'updated=',d.get('last_updated'), 'reporting=',d.get('percent_reporting'))" >> probe/civic_status.txt 2>&1 || echo "$id fetch failed" >> probe/civic_status.txt
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/ && git commit -m "Probe civicAPI status" && git pull --rebase -X theirs origin main && git push origin HEAD:main
