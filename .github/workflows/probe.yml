# Temporary: lets Claude see what civicAPI offers (its workspace can't reach civicAPI). Delete after use.
name: Probe civicAPI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml", "scripts/probe_civicapi.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_civicapi.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/ && git commit -m "Probe civicAPI" && git pull --rebase && git push
