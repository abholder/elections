# Temporary: learn Kalshi's market names. Delete after use.
name: Probe Kalshi
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/probe_kalshi.py || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/ && git commit -m "Probe Kalshi" && git pull --rebase -X theirs origin main && git push origin HEAD:main
