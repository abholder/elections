# Temporary: check that every "Official results" link loads. Delete after use.
name: Probe links
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p probe
          python3 -c "import json;[print(v) for k,v in json.load(open('data/races.json'))['official_results'].items() if not k.startswith('_')]" > /tmp/urls
          while read u; do
            code=$(curl -s -o /dev/null -L -k -m 25 -A "Mozilla/5.0 (Macintosh) Chrome/124" -w "%{http_code} %{url_effective}" "$u")
            echo "$u -> $code" | tee -a probe/links.txt
          done < /tmp/urls
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/ && git commit -m "Probe links" && git pull --rebase -X theirs origin main && git push origin HEAD:main
