# Election-night results: runs scripts/fetch_results.py and commits data/results.json.
# On election night the Scheduler workflow starts this every 5 minutes. Afterwards it
# runs twice a day for the week of late counting. The page also reads civicAPI directly
# in the browser, so most results don't wait for this job at all.
name: Update results

on:
  schedule:
    - cron: "7,37 12,0 4-13 11 *"  # ~6am and ~6pm Central, Nov 4-13 (UTC; Central is UTC-6 then)
  workflow_dispatch:            # "Run workflow" button, also handy for a test run
  push:
    branches: [main]
    paths: ["scripts/fetch_results.py", "scripts/fetch_alaska.py", ".github/workflows/results.yml"]

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: true

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pdftotext (reads Alaska's results PDF)
        run: sudo apt-get install -y poppler-utils
      - run: python scripts/fetch_results.py
      - name: Commit if anything changed
        # Two runs can overlap (a push and the timer, say). If another run saved data first,
        # rebase onto it and keep THIS run's numbers (-X theirs: during a rebase "theirs"
        # is the commit being replayed, i.e. ours). Retry a few times, then give up quietly.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Update results $(date -u +'%H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $i failed; retrying"; git rebase --abort 2>/dev/null; sleep $((i * 5))
          done
          echo "::warning::Could not save data this run; the next run will try again."
