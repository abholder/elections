# Election-night clock.
#
# GitHub's built-in timer is best-effort (it skipped most hourly runs on this repo), which
# is fine for twice-a-day data but not for election night. So on election night only, this
# job stays awake and starts "Update results" every 5 minutes and "Update data" every hour.
#
#   Window: Nov 4 00:00-12:00 UTC = Tue Nov 3, 6pm to Wed Nov 4, 6am Central.
#
# It's started by several timer attempts Tuesday afternoon (any one is enough; extra copies
# wait in line). If a run starts early, it waits for the window. A run reaches GitHub's
# 6-hour limit partway through the night, so it starts a fresh copy of itself to finish.
# Outside election night it does nothing and exits.
#
# Why this is allowed: runs started with the built-in GITHUB_TOKEN can't trigger other
# workflows, EXCEPT through workflow_dispatch, which is what `gh workflow run` uses.
name: Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 20-23 3 11 *"   # Tue Nov 3, 2pm-5:40pm Central: tries to start the night

permissions:
  actions: write   # lets this job start the other workflows
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false   # a second copy waits its turn instead of running alongside

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Run the election-night clock
        id: clock
        run: |
          start=$(date -d "2026-11-04T00:00:00Z" +%s)
          end=$(date -d "2026-11-04T12:00:00Z" +%s)
          stop=$(( $(date +%s) + 330*60 ))      # stay under GitHub's 6-hour job limit
          now=$(date +%s)
          if [ "$now" -ge "$end" ] || [ "$now" -lt $((start - 6*3600)) ]; then
            echo "Not election night; nothing to do."; exit 0
          fi
          if [ "$now" -lt "$start" ]; then
            echo "Early; waiting $(( (start - now) / 60 )) minutes for polls to close."
            sleep $((start - now))
          fi
          last_data=0; last_results=0
          while [ "$(date +%s)" -lt "$end" ] && [ "$(date +%s)" -lt "$stop" ]; do
            now=$(date +%s)
            if [ $((now - last_results)) -ge 300 ]; then
              gh workflow run results.yml && echo "$(date -u +%H:%M) started Update results"; last_results=$now
            fi
            if [ $((now - last_data)) -ge 3600 ]; then
              gh workflow run update-data.yml && echo "$(date -u +%H:%M) started Update data"; last_data=$now
            fi
            sleep 30
          done
          if [ "$(date +%s)" -lt "$end" ]; then echo "handoff=true" >> "$GITHUB_OUTPUT"; fi

      - name: Hand off to a fresh copy to finish the night
        if: steps.clock.outputs.handoff == 'true'
        run: |
          waiting=$(gh run list --workflow scheduler.yml --status queued --json databaseId --jq length)
          if [ "$waiting" = "0" ]; then gh workflow run scheduler.yml && echo "Handed off."; else echo "A copy is already queued."; fi
