# A dependable clock for the other two jobs.
#
# GitHub's built-in timer ("schedule:") is best-effort: on this repo it fired once in
# 12 hours instead of hourly. This job is the workaround. It stays running for ~5.5 hours,
# starting "Update data" every hour and, on election night, "Update results" every 5 minutes.
# Before it times out it starts a fresh copy of itself, so the chain keeps going.
#
# Why this is allowed: runs started with the built-in GITHUB_TOKEN can't trigger other
# workflows, EXCEPT through workflow_dispatch, which is what `gh workflow run` uses.
# Actions minutes are free and unlimited for public repositories.
#
# The schedule below is only a safety net: if the chain ever breaks, it restarts it.
# Everything stops on its own after Nov 14, 2026 (see the first step).
name: Scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/scheduler.yml"]
  schedule:
    - cron: "41 */2 * * *"

permissions:
  actions: write   # lets this job start the other workflows
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false   # a second copy waits its turn instead of running alongside

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Stop for good once the election is over
        id: season
        run: |
          # After Nov 14 (a week of late counting) the chain ends: no more jobs, no hand-off.
          if [ "$(date +%s)" -ge "$(date -d '2026-11-14T00:00:00Z' +%s)" ]; then
            echo "Election season is over; not running." ; echo "over=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the other jobs on a steady clock
        if: steps.season.outputs.over != 'true'
        run: |
          stop=$(( $(date +%s) + 330*60 ))        # run for 5.5 hours
          night_start=$(date -d "2026-11-04T00:00:00Z" +%s)   # 7pm Central, Nov 3
          night_end=$(date -d "2026-11-04T12:00:00Z" +%s)     # 6am Central, Nov 4
          late_end=$(date -d "2026-11-14T00:00:00Z" +%s)      # a week of late counting
          last_data=0; last_results=0
          while [ "$(date +%s)" -lt "$stop" ]; do
            now=$(date +%s)
            if [ $((now - last_data)) -ge 3600 ]; then
              gh workflow run update-data.yml && echo "$(date -u +%H:%M) started Update data"
              last_data=$now
            fi
            every=0
            if [ "$now" -ge "$night_start" ] && [ "$now" -lt "$night_end" ]; then every=300
            elif [ "$now" -ge "$night_end" ] && [ "$now" -lt "$late_end" ]; then every=1800; fi
            if [ "$every" -gt 0 ] && [ $((now - last_results)) -ge "$every" ]; then
              gh workflow run results.yml && echo "$(date -u +%H:%M) started Update results"
              last_results=$now
            fi
            sleep 60
          done

      - name: Hand off to a fresh copy of this job
        if: always() && steps.season.outputs.over != 'true'
        run: |
          # If a copy is already waiting (e.g. the safety-net timer started one), let it take over.
          waiting=$(gh run list --workflow scheduler.yml --status queued --json databaseId --jq length)
          if [ "$waiting" = "0" ]; then gh workflow run scheduler.yml && echo "Handed off."; else echo "A copy is already queued."; fi
